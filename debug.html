<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>调试 - 球跳跃游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 100%; 
            height: 100%; 
            font-family: monospace; 
            background: #1a1a1a; 
            color: #00ff00; 
            padding: 20px;
            overflow: auto;
        }
        #console { 
            background: #0a0a0a; 
            border: 1px solid #00ff00;
            padding: 10px;
            border-radius: 5px;
            max-height: 600px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .log { margin: 5px 0; }
        .error { color: #ff0000; }
        .warn { color: #ffaa00; }
        .success { color: #00ff00; }
        button { 
            padding: 10px 20px; 
            background: #00aa00; 
            color: #000; 
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #00ff00; }
    </style>
</head>
<body>
    <h1>🎮 球跳跃游戏 - 调试控制台</h1>
    
    <div>
        <button onclick="testImport()">测试导入</button>
        <button onclick="testThree()">测试 Three.js</button>
        <button onclick="testTypes()">测试类型系统</button>
        <button onclick="clearConsole()">清空日志</button>
    </div>
    
    <div id="console"></div>

    <script type="module">
        const consoleEl = document.getElementById('console')

        function log(msg, type = 'log') {
            const line = document.createElement('div')
            line.className = `log ${type}`
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`
            consoleEl.appendChild(line)
            consoleEl.scrollTop = consoleEl.scrollHeight
            console.log(msg)
        }

        window.log = log

        // 监听全局错误
        window.addEventListener('error', (e) => {
            log(`❌ ERROR: ${e.message}`, 'error')
            log(`   at ${e.filename}:${e.lineno}:${e.colno}`, 'error')
        })

        window.addEventListener('unhandledrejection', (e) => {
            log(`❌ UNHANDLED REJECTION: ${e.reason}`, 'error')
        })

        log('🟢 调试控制台已启动', 'success')
        log('正在测试导入...')

        // 测试导入
        window.testImport = async () => {
            try {
                log('正在导入 BallPhysics...')
                const { default: BallPhysics } = await import('/src/game/BallPhysics.ts')
                log('✅ BallPhysics 导入成功', 'success')
                
                log('正在导入 TrackManager...')
                const { default: TrackManager } = await import('/src/managers/TrackManager.ts')
                log('✅ TrackManager 导入成功', 'success')
                
                log('正在导入 Renderer3D...')
                const { default: Renderer3D } = await import('/src/3d/Renderer3D.ts')
                log('✅ Renderer3D 导入成功', 'success')
                
                log('正在导入 GameCore...')
                const { default: GameCore } = await import('/src/game/GameCore.ts')
                log('✅ GameCore 导入成功', 'success')
            } catch (e) {
                log(`❌ 导入失败: ${e.message}`, 'error')
            }
        }

        // 测试 Three.js
        window.testThree = async () => {
            try {
                log('正在导入 Three.js...')
                const THREE = await import('three')
                log('✅ Three.js 导入成功', 'success')
                log(`   版本: ${THREE.REVISION}`)
            } catch (e) {
                log(`❌ Three.js 导入失败: ${e.message}`, 'error')
            }
        }

        // 测试类型系统
        window.testTypes = async () => {
            try {
                log('正在导入类型定义...')
                const types = await import('/src/game/types.ts')
                log('✅ 类型定义导入成功', 'success')
                log(`   GameState: ${Object.keys(types.GameState).join(', ')}`)
                log(`   Difficulty: ${Object.keys(types.Difficulty).join(', ')}`)
                log(`   ColorType: ${Object.keys(types.ColorType).join(', ')}`)
            } catch (e) {
                log(`❌ 类型定义导入失败: ${e.message}`, 'error')
            }
        }

        window.clearConsole = () => {
            consoleEl.innerHTML = ''
            log('🟢 日志已清空', 'success')
        }

        // 自动测试
        setTimeout(() => {
            log('自动启动测试...')
            window.testImport()
        }, 500)
    </script>
</body>
</html>
